<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <style>
        body {
            font-family: Arial, sans-serif; /* Sets the font for the page */
            background-color: #f4f4f9; /* Light grey background for a soft look */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Full viewport height */
            margin: 0;
        }
        .thank-you-message {
            text-align: center;
            background-color: #ffffff; /* White background for the message box */
            padding: 50px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1); /* Subtle shadow for 3D effect */
            border-radius: 10px;
        }
        h1 {
            color: #4a47a3; /* Dark blue for the title */
        }
        p {
            color: #333333; /* Dark grey for the text */
        }
    </style>
</head>
<body>
    <div class="thank-you-message">
        <h1>Thank You!</h1>
        <p>Your submission has been received. We appreciate your time and effort.</p>
    </div>
</body>
</html>
